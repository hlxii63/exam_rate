<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>试卷难度与实力估计（多级过程分·修正版）</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f7fc; margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; }
        .container { max-width: 1100px; width: 100%; background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.07); }
        h1 { font-size: 1.8rem; font-weight: 600; margin-top: 0; color: #0b1e33; border-bottom: 2px solid #eef2f6; padding-bottom: 0.6rem; }
        .global-time { display: flex; align-items: center; gap: 1rem; margin: 1.2rem 0 1.5rem 0; flex-wrap: wrap; background: #f8fafc; padding: 0.8rem 1.2rem; border-radius: 12px; }
        .global-time label { font-weight: 500; color: #1e293b; }
        .global-time input { width: 100px; padding: 0.4rem 0.6rem; border: 1px solid #d1d9e6; border-radius: 8px; font-size: 0.95rem; text-align: center; }
        .toolbar { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        button { padding: 0.55rem 1.4rem; border: none; border-radius: 40px; font-weight: 500; font-size: 0.95rem; background: #eef2f6; color: #1e293b; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; }
        button.primary { background: #2563eb; color: white; box-shadow: 0 4px 8px rgba(37,99,235,0.15); }
        button.primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        button.success { background: #16a34a; color: white; box-shadow: 0 4px 8px rgba(22,163,74,0.15); }
        button.success:hover { background: #15803d; transform: translateY(-1px); }
        button.outline { background: transparent; border: 1.5px solid #d1d9e6; }
        button.outline:hover { background: #f1f4fa; }
        button.danger { background: #ef4444; color: white; }
        button.danger:hover { background: #dc2626; }
        .problem-card { background: #fafcff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 1.2rem 1.2rem 0.8rem 1.2rem; margin-bottom: 1.2rem; transition: border 0.2s; }
        .problem-card:hover { border-color: #cbd5e1; }
        .problem-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; }
        .problem-title { font-weight: 600; font-size: 1.05rem; color: #1e293b; }
        .branch-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 0.5rem; }
        .branch-table th { background: #f1f4fa; color: #1e293b; font-weight: 600; padding: 0.4rem 0.3rem; text-align: center; border-bottom: 2px solid #d1d9e6; }
        .branch-table td { padding: 0.3rem 0.2rem; text-align: center; border-bottom: 1px solid #e9edf4; }
        .branch-table input { width: 100%; min-width: 60px; padding: 0.35rem 0.3rem; border: 1px solid #d1d9e6; border-radius: 8px; font-size: 0.85rem; text-align: center; background: white; transition: border 0.2s; }
        .branch-table input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .branch-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
        .branch-actions button { padding: 0.2rem 0.8rem; font-size: 0.8rem; }
        .result-box { background: #f8faff; border-radius: 16px; padding: 1.2rem 1.6rem; margin: 1.5rem 0 1rem 0; border-left: 5px solid #2563eb; }
        .result-box h3 { margin: 0 0 0.3rem 0; font-weight: 500; color: #1e293b; }
        .result-box .value { font-size: 1.8rem; font-weight: 700; color: #0b1e33; }
        .row-flex { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin: 1.2rem 0; }
        .row-flex label { font-weight: 500; color: #2c3e50; }
        .row-flex input { padding: 0.4rem 0.8rem; border: 1px solid #d1d9e6; border-radius: 8px; width: 130px; font-size: 0.95rem; }
        .hint { color: #64748b; font-size: 0.85rem; margin-top: 0.2rem; }
        .footnote { margin-top: 2rem; font-size: 0.82rem; color: #94a3b8; border-top: 1px solid #e9edf4; padding-top: 1rem; text-align: center; }
        .empty-msg { color: #94a3b8; padding: 1rem 0; text-align: center; }
        .warning { color: #b45309; background: #fffbeb; padding: 0.4rem 0.8rem; border-radius: 8px; border-left: 4px solid #f59e0b; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 试卷难度 & 考生实力估计（多级过程分）</h1>

    <div class="global-time">
        <label for="totalTime">⏱ 总考试时间（分钟）：</label>
        <input type="number" id="totalTime" step="0.1" min="0.1" placeholder="例如 60" />
        <span style="color:#64748b; font-size:0.9rem;">（所有题目均分此时间）</span>
    </div>

    <div class="toolbar">
        <button class="primary" onclick="addProblem()">➕ 添加大题</button>
        <button class="primary" onclick="computeDifficulty()">📐 计算试卷难度 M</button>
    </div>

    <div id="problemsContainer">
        <div class="empty-msg">点击「添加大题」开始组卷</div>
    </div>

    <div class="result-box" id="difficultyResult" style="display:none;">
        <h3>📌 试卷难度指标 M</h3>
        <div class="value" id="mValue">—</div>
        <div class="hint">期望总分 = 满分一半 时对应的考生实力 μ</div>
    </div>

    <div class="row-flex">
        <label for="scoreInput">考生得分 D：</label>
        <input type="number" id="scoreInput" step="0.1" min="0" placeholder="例如 75" />
        <button class="success" onclick="estimateMu()">🎯 估计实力 μ</button>
    </div>

    <div class="result-box" id="muResult" style="display:none;">
        <h3>🧠 估计的考生实力 μ</h3>
        <div class="value" id="muValue">—</div>
        <div class="hint" id="muHint">基于逻辑斯蒂克近似反推（要求 0 < D < 满分）</div>
    </div>

    <div class="footnote">
        模型：P(做对) = Φ((μ−a)/0.5) · Φ((log₂(t)−b+0.5μ+2.5)/0.5) <br />
        过程分采用累积概率差分，每题时间 = 总时间 / 题目数。
    </div>
</div>

<script>
    // ---------- 数值工具 ----------
    function erf_approx(x) {
        const sign = x >= 0 ? 1 : -1;
        x = Math.abs(x);
        const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
              a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
        const t = 1 / (1 + p * x);
        const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
        return sign * y;
    }
    function normCDF(x) { return 0.5 * (1 + erf_approx(x / Math.SQRT2)); }
    function normPDF(x) { return (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x); }

    // ---------- 全局数据 ----------
    let problems = []; // 存储每道题的数据结构：{ main: {score, a, b}, branches: [{score, a, b}] }

    // ---------- DOM 同步：将当前界面数据读入 problems ----------
    function syncProblemsFromDOM() {
        const cards = document.querySelectorAll('.problem-card');
        if (cards.length === 0) {
            problems = [];
            return;
        }
        const newProblems = [];
        for (const card of cards) {
            // 主档次
            const mainScore = parseFloat(card.querySelector('.main-score').value);
            const mainA = parseFloat(card.querySelector('.main-a').value);
            const mainB = parseFloat(card.querySelector('.main-b').value);
            if (isNaN(mainScore) || mainScore <= 0) {
                // 不阻断，但后续校验会提示
            }
            const main = { score: isNaN(mainScore) ? 0 : mainScore, a: isNaN(mainA) ? 0 : mainA, b: isNaN(mainB) ? 0 : mainB };

            // 过程分档次
            const scoreInputs = card.querySelectorAll('.b-score');
            const aInputs = card.querySelectorAll('.b-a');
            const bInputs = card.querySelectorAll('.b-b');
            const branches = [];
            for (let i = 0; i < scoreInputs.length; i++) {
                const s = parseFloat(scoreInputs[i].value);
                const a = parseFloat(aInputs[i].value);
                const b = parseFloat(bInputs[i].value);
                if (!isNaN(s) && s > 0) {
                    branches.push({ score: s, a: isNaN(a) ? 0 : a, b: isNaN(b) ? 0 : b });
                }
            }
            newProblems.push({ main, branches });
        }
        problems = newProblems;
    }

    // ---------- 渲染 ----------
    function render() {
        const container = document.getElementById('problemsContainer');
        if (!problems.length) {
            container.innerHTML = '<div class="empty-msg">点击「添加大题」开始组卷</div>';
            return;
        }
        let html = '';
        problems.forEach((p, pIdx) => {
            const main = p.main;
            html += `
                <div class="problem-card" data-pindex="${pIdx}">
                    <div class="problem-header">
                        <span class="problem-title">📝 题目 #${pIdx + 1} （满分 ${main.score || '?'} 分）</span>
                        <button class="danger" style="padding:0.2rem 0.8rem;" onclick="removeProblem(${pIdx})">删除题目</button>
                    </div>
                    <table class="branch-table">
                        <thead><tr><th style="width:18%;">得分 v</th><th style="width:27%;">门槛 a</th><th style="width:27%;">计算要求 b</th><th style="width:28%;">备注</th></tr></thead>
                        <tbody>
                            <tr>
                                <td><input type="number" step="any" min="0" class="main-score" value="${main.score !== undefined && main.score !== null ? main.score : ''}" placeholder="满分" /></td>
                                <td><input type="number" step="any" class="main-a" value="${main.a !== undefined && main.a !== null ? main.a : ''}" placeholder="a" /></td>
                                <td><input type="number" step="any" class="main-b" value="${main.b !== undefined && main.b !== null ? main.b : ''}" placeholder="b" /></td>
                                <td style="font-size:0.8rem; color:#64748b;">主档次（满分）</td>
                            </tr>
                            ${p.branches.map((b, bIdx) => `
                                <tr>
                                    <td><input type="number" step="any" min="0" class="b-score" value="${b.score !== undefined && b.score !== null ? b.score : ''}" placeholder="得分" /></td>
                                    <td><input type="number" step="any" class="b-a" value="${b.a !== undefined && b.a !== null ? b.a : ''}" placeholder="a" /></td>
                                    <td><input type="number" step="any" class="b-b" value="${b.b !== undefined && b.b !== null ? b.b : ''}" placeholder="b" /></td>
                                    <td><button class="danger" style="padding:0.1rem 0.6rem; font-size:0.75rem;" onclick="removeBranch(${pIdx}, ${bIdx})">✕</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="branch-actions">
                        <button class="outline" onclick="addBranch(${pIdx})">➕ 添加过程分</button>
                    </div>
                    <div style="font-size:0.75rem; color:#94a3b8; margin-top:0.3rem;">过程分得分应小于满分，系统自动排序。</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ---------- 操作函数（先同步数据，再修改，再渲染） ----------
    function addProblem() {
        syncProblemsFromDOM();
        problems.push({
            main: { score: undefined, a: undefined, b: undefined },
            branches: []
        });
        render();
    }

    function removeProblem(index) {
        syncProblemsFromDOM();
        if (problems.length <= 1) {
            if (!confirm('至少保留一道题，确定删除吗？')) return;
        }
        problems.splice(index, 1);
        render();
    }

    function addBranch(pIdx) {
        syncProblemsFromDOM();
        problems[pIdx].branches.push({ score: undefined, a: undefined, b: undefined });
        render();
    }

    function removeBranch(pIdx, bIdx) {
        syncProblemsFromDOM();
        if (problems[pIdx].branches.length === 0) return;
        problems[pIdx].branches.splice(bIdx, 1);
        render();
    }

    // ---------- 数据收集（从 problems 中提取有效数据，并校验） ----------
    function collectValidProblems() {
        // 先同步一次，确保 problems 最新
        syncProblemsFromDOM();
        const valid = [];
        let hasError = false;
        for (const p of problems) {
            const main = p.main;
            if (!main.score || main.score <= 0) {
                alert('每道题必须填写有效的满分（>0）。');
                hasError = true;
                break;
            }
            // 过滤过程分：只保留得分大于0且小于满分的
            const branches = p.branches.filter(b => b.score && b.score > 0 && b.score < main.score);
            // 去重（若得分相同，保留后一个？简单处理：按得分升序，若重复则忽略后面的）
            const sorted = branches.sort((a,b) => a.score - b.score);
            const unique = [];
            let last = -Infinity;
            for (const item of sorted) {
                if (item.score !== last) {
                    unique.push(item);
                    last = item.score;
                }
            }
            // 检查是否有过程分等于满分
            if (unique.some(b => b.score >= main.score)) {
                alert('过程分得分必须小于满分。');
                hasError = true;
                break;
            }
            valid.push({
                main: { score: main.score, a: main.a || 0, b: main.b || 0 },
                branches: unique
            });
        }
        if (hasError) return null;
        return valid;
    }

    // ---------- 核心计算 ----------
    function computeExpectedAndDeriv(mu, problems, totalTime) {
        const n = problems.length;
        if (n === 0) return { E: 0, dE: 0 };
        const t = totalTime / n;
        let E = 0, dE = 0;
        for (const prob of problems) {
            // 所有档次：主 + 过程分，按得分升序
            const all = [prob.main, ...prob.branches];
            all.sort((a,b) => a.score - b.score);
            // 去重
            const unique = [];
            let lastScore = -Infinity;
            for (const item of all) {
                if (item.score !== lastScore) {
                    unique.push(item);
                    lastScore = item.score;
                }
            }
            let prevV = 0;
            for (const item of unique) {
                const v = item.score;
                if (v <= prevV) continue;
                const delta = v - prevV;
                const a = item.a;
                const b = item.b;
                // 修正符号：P(X > a) = Φ((μ - a)/0.5)
                const z1 = (mu - a) / 0.5;
                const z2 = (Math.log2(t) - b + 0.5 * mu + 2.5) / 0.5;
                const p1 = normCDF(z1);
                const p2 = normCDF(z2);
                const P_ge = p1 * p2;
                // 导数：d/dμ p1 = (1/0.5)*φ(z1) = 2*φ(z1)
                const dp1 = 2.0 * normPDF(z1);
                const dp2 = 1.0 * normPDF(z2);
                const dP_ge = dp1 * p2 + p1 * dp2;
                E += delta * P_ge;
                dE += delta * dP_ge;
                prevV = v;
            }
        }
        return { E, dE };
    }

    function findM(problems, totalTime, tol = 1e-7) {
        const n = problems.length;
        if (n === 0) return 0;
        let S_max = 0;
        for (const p of problems) S_max += p.main.score;
        if (S_max === 0) return 0;
        const target = S_max / 2;
        let mu_low = -10, mu_high = 10;
        let E_low = computeExpectedAndDeriv(mu_low, problems, totalTime).E;
        while (E_low > target) { mu_low -= 5; E_low = computeExpectedAndDeriv(mu_low, problems, totalTime).E; }
        let E_high = computeExpectedAndDeriv(mu_high, problems, totalTime).E;
        while (E_high < target) { mu_high += 5; E_high = computeExpectedAndDeriv(mu_high, problems, totalTime).E; }
        for (let i = 0; i < 120; i++) {
            const mu_mid = (mu_low + mu_high) / 2;
            const E_mid = computeExpectedAndDeriv(mu_mid, problems, totalTime).E;
            if (E_mid < target) mu_low = mu_mid;
            else mu_high = mu_mid;
            if (mu_high - mu_low < tol) break;
        }
        return (mu_low + mu_high) / 2;
    }

    // ---------- 界面计算 ----------
    function computeDifficulty() {
        const totalTime = parseFloat(document.getElementById('totalTime').value);
        if (isNaN(totalTime) || totalTime <= 0) {
            alert('请先输入有效的总考试时间（>0）。');
            return;
        }
        const probs = collectValidProblems();
        if (!probs) return;
        let S_max = 0;
        for (const p of probs) S_max += p.main.score;
        if (S_max === 0) { alert('满分不能为0。'); return; }
        try {
            const M = findM(probs, totalTime);
            document.getElementById('mValue').textContent = M.toFixed(6);
            document.getElementById('difficultyResult').style.display = 'block';
            document.getElementById('muResult').style.display = 'none';
            window._lastProbs = probs;
            window._lastM = M;
            window._lastTotalTime = totalTime;
            const { dE } = computeExpectedAndDeriv(M, probs, totalTime);
            window._lastSlope = dE;
            window._lastSmax = S_max;
        } catch(e) { alert('计算失败：'+e.message); }
    }

    function estimateMu() {
        if (!window._lastProbs || window._lastM === undefined) {
            alert('请先计算试卷难度 M。');
            return;
        }
        const D = parseFloat(document.getElementById('scoreInput').value);
        const S_max = window._lastSmax;
        if (isNaN(D) || D <= 0) { alert('请输入有效的得分 D（>0）。'); return; }
        if (D >= S_max) {
            if (D > S_max * 0.99) {
                document.getElementById('muValue').textContent = '→ +∞ (接近满分)';
                document.getElementById('muHint').textContent = '考生实力远超试卷水平，无法精确估计。';
                document.getElementById('muResult').style.display = 'block';
                return;
            } else { alert(`得分必须小于满分 (${S_max})。`); return; }
        }
        const M = window._lastM;
        const dE = window._lastSlope;
        if (dE <= 0) { alert('斜率为非正，无法估计。'); return; }
        const k = 4.0 * dE / S_max;
        const mu_est = M + (1.0 / k) * Math.log(D / (S_max - D));
        document.getElementById('muValue').textContent = mu_est.toFixed(6);
        document.getElementById('muHint').textContent = `D = ${D}，满分 ${S_max}`;
        document.getElementById('muResult').style.display = 'block';
    }

    // ---------- 初始化：一道空白题 ----------
    problems = [{ main: { score: undefined, a: undefined, b: undefined }, branches: [] }];
    render();

    // 暴露全局函数
    window.addProblem = addProblem;
    window.removeProblem = removeProblem;
    window.addBranch = addBranch;
    window.removeBranch = removeBranch;
    window.computeDifficulty = computeDifficulty;
    window.estimateMu = estimateMu;
</script>
</body>
</html>
